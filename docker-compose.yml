services:
  database:
    image: postgres:17-alpine
    container_name: finace-database
    environment:
      POSTGRES_DB: finance_db
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
    ports:
      - "5433:5432"
    volumes:
      - finance_data:/var/lib/postgresql/data #important for backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  finance_data:
